# Railway App Configuration
# railway.toml
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python run_server.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production]
variables = [
  "DISCOUNT_THRESHOLD=40",
  "REQUEST_TIMEOUT=30",
  "LOG_LEVEL=INFO",
  "PLATFORM=railway"
]